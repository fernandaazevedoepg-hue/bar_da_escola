{% extends "personal_page/base.html" %}
{% block body_class %}fundo-padrao{% endblock %}


{% block title %}
    Login
{% endblock %}

{% block content %}
    <div class="catalogo-container text-center" style="max-width: 520px;">
        <h2>Entrar</h2>

        {% for message in messages %}
            <p class="text-{{ message.tags }}">{{ message }}</p>
        {% endfor %}

        <form 
            method="post" 
            action="{% url 'login' %}" 
            class="d-flex flex-column align-items-center gap-2"
        >
            {% csrf_token %}
            <input 
                type="email" 
                name="email" 
                placeholder="Email" 
                class="form-control" 
                required
            >
            <input 
                type="password" 
                name="password" 
                placeholder="Palavra-passe" 
                class="form-control" 
                required
            >
            <button class="btn btn-success mt-2" type="submit">Entrar</button>
        </form>

        <p class="mt-3">
            Ainda não tem conta? 
            <a href="{% url 'registar' %}">Registar</a>
        </p>
    </div>
{% endblock %}
